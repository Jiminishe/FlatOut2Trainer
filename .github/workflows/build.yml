name: Build FlatOut 2 Trainer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ARCHITECTURE: x86

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        config:
          - name: "Release x86"
            build_type: Release
            arch: Win32
          - name: "Debug x86"
            build_type: Debug
            arch: Win32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ImGui
        run: |
          if not exist external\imgui\imgui.h (
            mkdir external\imgui 2>nul
            mkdir external\imgui\backends 2>nul
            curl -L -o imgui.zip https://github.com/ocornut/imgui/archive/refs/tags/v1.91.2.zip
            powershell -Command "Expand-Archive -Force imgui.zip"
            move imgui-1.91.2\* external\imgui\
            rmdir /s /q imgui-1.91.2
            del imgui.zip
          )
        shell: cmd

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure CMake
        run: |
          cmake -B build -A ${{ matrix.config.arch }} -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
        shell: cmd

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.config.build_type }} --parallel
        shell: cmd

      - name: Verify outputs
        run: |
          ls build/bin/${{ matrix.config.build_type }}/*.exe
          ls build/bin/${{ matrix.config.build_type }}/*.dll
        shell: cmd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlatOut2Trainer-${{ matrix.config.name }}
          path: |
            build/bin/${{ matrix.config.build_type }}/FlatOut2Trainer.exe
            build/bin/${{ matrix.config.build_type }}/FlatOut2TrainerDLL.dll
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/bin/${{ matrix.config.build_type }}/FlatOut2Trainer.exe
            build/bin/${{ matrix.config.build_type }}/FlatOut2TrainerDLL.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Smoke Test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: FlatOut2Trainer-Release x86
          path: artifacts

      - name: Verify files exist
        run: |
          Test-Path artifacts\FlatOut2Trainer.exe
          Test-Path artifacts\FlatOut2TrainerDLL.dll
          (Get-Item artifacts\FlatOut2Trainer.exe).Length
          (Get-Item artifacts\FlatOut2TrainerDLL.dll).Length
        shell: pwsh